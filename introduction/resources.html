<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Codex: System Resources</title>
    <link rel="stylesheet" href="css/resources.css">
</head>

<body>

<div class="container py-5" id="resources-app" v-cloak>
    <h2 class="rpg-title text-center mb-5">THE SCHOLAR'S DECK</h2>

    <div class="d-flex justify-content-center gap-3 mb-5">
        <button @click="filter = 'learning'" :class="{'active-tab': filter === 'learning'}" class="pixel-tab">SCROLLS</button>
        <button @click="filter = 'assets'" :class="{'active-tab': filter === 'assets'}" class="pixel-tab">LOOT</button>
    </div>

    <div class="row g-4 justify-content-center">
        <div v-for="(item, index) in filteredResources" :key="index" class="col-md-4 col-sm-6">
            <div class="pixel-card-container" @click="item.flipped = !item.flipped">
                <div class="pixel-card" :class="{ 'is-flipped': item.flipped }">
                    
                    <div class="card-face card-back">
                        <div class="card-pattern"></div>
                        <div class="card-rarity">{{ item.category.toUpperCase() }}</div>
                    </div>

                    <div class="card-face card-front">
                        <span class="icon">{{ item.icon }}</span>
                        <h3>{{ item.name }}</h3>
                        <p>{{ item.desc }}</p>
                        <a :href="item.url" target="_blank" class="claim-btn">VIEW RESOURCE</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script src="js/resources.js"></script>

</body>
</html>
